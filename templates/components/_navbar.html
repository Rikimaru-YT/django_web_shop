<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">DjangoWebShop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Магазин</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'shop' %}">Детали продукта</a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link fw-bold" href="{% url 'auth' %}">Профиль</a>
        </li>
        {% endif %}
      </ul>

      <form action="{% url 'shop' %}" method="get" class="d-flex" role="search">
    <input
        class="form-control me-2"
        type="search"
        name="q"
        placeholder="Поиск товаров..."
        aria-label="Search"
        value="{{ search_query|default:'' }}"
        required>
    <button class="btn btn-outline-success" type="submit">Найти</button>
     </form>


      {% if not user.is_authenticated %}
      <div class="ms-2">
        <a href="{% url 'login' %}" class="btn btn-outline-success me-2">Войти</a>
        <a href="{% url 'register' %}" class="btn btn-outline-warning">Регистрация</a>
      </div>
      {% else %}
      {% endif %}
    </div>
  </div>
</nav>
